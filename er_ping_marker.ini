; er_ping_marker settings. The in-game menu (MenuKey) rewrites this file.
; Key names: A-Z, 0-9, F1-F24, Num0-Num9, Space, Tab, Enter, Insert, Delete, Home, End,
; PageUp, PageDown, Left, Up, Right, Down, LShift, LCtrl, LAlt, Mouse3, Mouse4, Mouse5,
; or a virtual-key code such as 0xC0.

[Keys]
; Place a marker where the camera looks
PingKey=V
; Pick up the item in front of you and use it right away
QuickUseKey=1
; Open the settings window
MenuKey=F7
; Keys bound in the game itself (keyboard only). Change them if you rebound them in Elden Ring.
GameInteractKey=E
GameUseItemKey=R

[Marker]
Enabled=1
; Lifetime in seconds, 2-60
Duration=10
; 0 pin, 1 exclamation mark, 2 arrow, 3 cross, 4 circle
Symbol=0
; R,G,B 0-255
Color=156,209,59
ShowName=1
ShowDistance=1
; 0.5-2.5
Scale=1.00
; Set to 1 if markers appear mirrored left to right
MirrorX=0

[QuickUse]
; Experimental: temporarily puts the picked up consumable into the selected quick slot
Enabled=1

[General]
; ru or en
Language=ru
; Ignore PingKey and QuickUseKey while the mouse cursor is visible (game menus)
IgnoreWhenCursorVisible=1
Log=1

[Network]
; Send markers to the other players of the Seamless Co-op session (they need the mod too)
Enabled=1
; Learn session members from the Steam messages the game sends
PeerDiscoveryHook=1
